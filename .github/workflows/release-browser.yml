# Publishes @botguard/browser to npm when a tag browser-vX.Y.Z is pushed.
# Uses npm Trusted Publishing (OIDC): no token is stored in this repository.
# One-time setup on npmjs.com, after the first manual publish: package
# settings -> Trusted Publisher -> GitHub Actions, repository
# dkeepersun/BotGuard, workflow release-browser.yml (docs/release.md).
name: release-browser

on:
  push:
    tags: ["browser-v*"]

permissions:
  contents: read
  id-token: write # Trusted Publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Tag must match package.json version
        run: test "browser-v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      # Trusted Publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public
