# Publishes the server (gateway, admin-web, botguard-ctl) when a tag vX.Y.Z is
# pushed, or when publish.yml (the manual "发版" workflow) has created the tag
# and calls this workflow; vX.Y.Z-rc.1 and the like become pre-releases.
#
# - release: scripts/release.sh builds static linux and darwin (amd64, arm64)
#   tar.gz, Linux .deb and .rpm packages plus checksums.txt; each file gets a build
#   provenance attestation (gh attestation verify <file> -R dkeepersun/BotGuard).
#   With the REPO_GPG_PRIVATE_KEY secret set, the rpm packages are signed.
# - image: pushes ghcr.io/dkeepersun/botguard (amd64 + arm64).
# - repo.yml then rebuilds the APT/YUM repository on GitHub Pages.
# The SDK tags (browser-v*, php-v*, laravel-v*) never match v*. See docs/release.md.
name: release

on:
  push:
    tags: ["v*"]
  # A tag pushed with GITHUB_TOKEN starts no workflow, so publish.yml calls
  # this one directly with the tag it created.
  workflow_call:
    inputs:
      tag:
        description: The vX.Y.Z tag to publish (must already exist)
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make check
      - run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
      - name: Load the package signing key
        env:
          REPO_GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$REPO_GPG_PRIVATE_KEY" ]; then
            printf '%s\n' "$REPO_GPG_PRIVATE_KEY" > "$RUNNER_TEMP/signing.asc"
            echo "NFPM_RPM_KEY_FILE=$RUNNER_TEMP/signing.asc" >> "$GITHUB_ENV"
          else
            echo "::notice::REPO_GPG_PRIVATE_KEY is not set; rpm packages are unsigned"
          fi
      - run: scripts/release.sh "$TAG"
        env:
          BOTGUARD_REQUIRE_PACKAGES: "1"
          NFPM_RPM_PASSPHRASE: ${{ secrets.REPO_GPG_PASSPHRASE }}
      - run: rm -f "$RUNNER_TEMP/signing.asc"
        if: always()
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" dist/*.tar.gz dist/*.deb dist/*.rpm dist/checksums.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "BotGuard $TAG" --generate-notes "${flags[@]}"

  image:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # A release gets 0.2.0, 0.2 and latest; a pre-release (0.2.0-rc.1) only
      # its own version tag.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dkeepersun/botguard
          # value: called from publish.yml the ref is the branch, not the tag.
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
