# Publishes the server (gateway, admin-web, botguard-ctl) when a tag vX.Y.Z is
# pushed; vX.Y.Z-rc.1 and the like become pre-releases.
#
# - release: scripts/release.sh builds static linux/amd64 and linux/arm64
#   tar.gz, .deb and .rpm packages plus checksums.txt; each file gets a build
#   provenance attestation (gh attestation verify <file> -R dkeepersun/BotGuard).
#   With the REPO_GPG_PRIVATE_KEY secret set, the rpm packages are signed.
# - image: pushes ghcr.io/dkeepersun/botguard (amd64 + arm64).
# - repo.yml then rebuilds the APT/YUM repository on GitHub Pages.
# The SDK tags (browser-v*, php-v*, laravel-v*) never match v*. See docs/release.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make check
      - run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
      - name: Load the package signing key
        env:
          REPO_GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$REPO_GPG_PRIVATE_KEY" ]; then
            printf '%s\n' "$REPO_GPG_PRIVATE_KEY" > "$RUNNER_TEMP/signing.asc"
            echo "NFPM_RPM_KEY_FILE=$RUNNER_TEMP/signing.asc" >> "$GITHUB_ENV"
          else
            echo "::notice::REPO_GPG_PRIVATE_KEY is not set; rpm packages are unsigned"
          fi
      - run: scripts/release.sh "$GITHUB_REF_NAME"
        env:
          BOTGUARD_REQUIRE_PACKAGES: "1"
          NFPM_RPM_PASSPHRASE: ${{ secrets.REPO_GPG_PASSPHRASE }}
      - run: rm -f "$RUNNER_TEMP/signing.asc"
        if: always()
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.deb dist/*.rpm dist/checksums.txt \
            --verify-tag --title "BotGuard $GITHUB_REF_NAME" --generate-notes "${flags[@]}"

  image:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # 0.2.0 and 0.2 for every release; latest only for releases without a
      # pre-release suffix.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dkeepersun/botguard
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
