name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: botguard_test
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -proot" --health-interval 3s --health-retries 30
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: make check
      - run: shellcheck -S warning scripts/install.sh scripts/botguard.sh scripts/release.sh scripts/build-repo.sh deploy/nfpm/*.sh
      # macOS 的 bash 3.2 在非 UTF-8 环境下把 "$VAR（" 里全角字符的字节读成变量名的一部分，
      # 变量后面紧跟中文时要写成 ${VAR}。
      - name: No $VAR directly followed by non-ASCII
        run: |
          if grep -nP '\$[A-Za-z_][A-Za-z0-9_]*(?=[^\x00-\x7f])' scripts/*.sh deploy/nfpm/*.sh; then
            echo "::error::变量后面紧跟非 ASCII 字符，请改成 \${VAR}"
            exit 1
          fi
      - run: make test-integration
        env:
          BOTGUARD_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/botguard_test
          BOTGUARD_TEST_REDIS_ADDR: 127.0.0.1:6379
      - run: make test-sdk
      - run: composer validate --strict --no-check-publish packages/php/composer.json
      - run: composer validate --strict --no-check-publish packages/laravel/composer.json
      - run: cd packages/browser && npm publish --dry-run

  # The Go SDK promises Go >= 1.22; the main job runs the server's Go only.
  # The adapters resolve the core through packages/go/go.work.
  go-sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.22", "stable"]
    defaults:
      run:
        working-directory: packages/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: packages/go/**/go.sum
      - run: go vet ./... ./gin/... ./gozero/...
      - run: go test -race ./... ./gin/... ./gozero/...

  # The PHP SDK promises PHP >= 8.1; the main job runs 8.2 only.
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.1", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl
      - run: php packages/php/tests/run.php
      - run: php packages/laravel/tests/stepup.php
      - run: find packages/php packages/laravel -name '*.php' -print0 | xargs -0 -n1 php -l

  # The installation methods end to end on a fresh runner (systemd, sudo, no
  # Redis; on macOS: launchd, Homebrew): packages and the image are built from
  # this commit and served over local HTTP in place of GitHub Releases and
  # raw.githubusercontent.com.
  install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { method: binary, os: ubuntu-latest }
          - { method: deb, os: ubuntu-latest }
          - { method: docker, os: ubuntu-latest }
          - { method: macos, os: macos-latest }
    env:
      VERSION: v0.0.0-ci
      BOTGUARD_RELEASE_BASE: http://127.0.0.1:18080
      BOTGUARD_RAW_BASE: http://127.0.0.1:18080/raw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: matrix.method != 'docker'
        with:
          go-version-file: go.mod
      - name: Build packages
        if: matrix.method == 'binary' || matrix.method == 'deb'
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
          BOTGUARD_REQUIRE_PACKAGES=1 scripts/release.sh "$VERSION" linux/amd64
      - name: Build packages (macOS)
        if: matrix.method == 'macos'
        run: scripts/release.sh "$VERSION" darwin/arm64
      - name: Build the image
        if: matrix.method == 'docker'
        run: docker build -t "ghcr.io/dkeepersun/botguard:${VERSION#v}" --build-arg VERSION="$VERSION" .
      - name: Serve the release files
        run: |
          mkdir -p "/tmp/site/download/$VERSION" "/tmp/site/raw/$VERSION/deploy/docker"
          cp dist/* "/tmp/site/download/$VERSION/" 2>/dev/null || true
          cp deploy/docker/compose.yml "/tmp/site/raw/$VERSION/deploy/docker/"
          (cd /tmp/site && python3 -m http.server 18080 >/dev/null 2>&1 &)
          sleep 1

      - name: Install (binary)
        if: matrix.method == 'binary'
        run: sh scripts/install.sh --method binary --version "$VERSION" -y
      - name: Install (deb)
        if: matrix.method == 'deb'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ./dist/botguard_*_amd64.deb
          sudo botguard ctl admin create -username admin
      - name: Install (docker)
        if: matrix.method == 'docker'
        run: sh scripts/install.sh --method docker --version "$VERSION" --dir /tmp/botguard -y
      - name: Install (macOS)
        if: matrix.method == 'macos'
        run: sh scripts/install.sh --version "$VERSION" -y

      - name: Check the services
        run: |
          for port in 8090 8091; do
            for _ in $(seq 1 30); do
              curl -fsS "http://127.0.0.1:$port/readyz" | grep -q '"ready"' && break
              sleep 1
            done
            curl -fsS "http://127.0.0.1:$port/readyz"; echo
          done
          curl -fsS -o /dev/null http://127.0.0.1:8090/sdk/v1/load.js
      - name: Check the docker install
        if: matrix.method == 'docker'
        run: |
          # Redis has the generated password: without it every command is refused.
          docker compose -f /tmp/botguard/compose.yml --env-file /tmp/botguard/.env exec -T redis redis-cli ping | tee /tmp/ping.txt
          grep -q NOAUTH /tmp/ping.txt
      - name: Check the macOS install
        if: matrix.method == 'macos'
        run: |
          botguard status
          botguard ctl admin list | grep -q admin
          launchctl print "gui/$(id -u)/com.botguard.gateway" | grep -q "state = running"
          botguard restart
          sh scripts/install.sh --version "$VERSION" -y | tee /tmp/again.log
          grep -q 已升级 /tmp/again.log
          botguard uninstall-launchd
          if curl -fsS -m 2 http://127.0.0.1:8090/healthz; then exit 1; fi
      - name: Check the native install
        if: matrix.method == 'binary' || matrix.method == 'deb'
        run: |
          botguard status
          sudo botguard ctl admin list | grep -q admin
          systemctl is-enabled botguard-gateway botguard-admin-web
          sudo test "$(sudo stat -c %U /var/lib/botguard/botguard.db)" = botguard
      - name: Run the installer again (upgrade path)
        if: matrix.method == 'binary'
        run: |
          sh scripts/install.sh --method binary --version "$VERSION" -y | tee /tmp/again.log
          grep -q 已升级 /tmp/again.log
      - name: Remove the package
        if: matrix.method == 'deb'
        run: |
          sudo apt-get remove -y botguard
          if systemctl cat botguard-gateway >/dev/null 2>&1; then exit 1; fi
          sudo test -f /etc/botguard/botguard.env
