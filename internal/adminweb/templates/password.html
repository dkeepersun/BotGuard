{{template "head" .}}{{$d := .Data}}
<div class="wrap" style="max-width:720px">
  <div class="crumb"><a href="/admins">管理员</a> / {{$d.Username}}</div>
  <div class="page-head"><div><h1>{{.Title}}</h1><div class="sub">{{$d.Note}}</div></div></div>
  <div class="alert warn"><b>密码只显示这一次。</b>请通过安全的渠道交给对方，不要通过群聊明文发送。</div>
  <div class="card"><div class="card-body">
    <div class="form-row"><span class="label">用户名</span><div class="secret-box"><span>{{$d.Username}}</span></div></div>
    <div class="form-row"><span class="label">初始密码</span><div class="secret-box"><span id="pw">{{$d.Password}}</span><button class="btn sm" data-copy="#pw">复制</button></div></div>
    <a class="btn primary" href="/admins">返回管理员列表</a>
  </div></div>
</div>
{{template "foot" .}}
