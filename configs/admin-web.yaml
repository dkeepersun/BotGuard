Name: botguard-admin
# Keep the console on a private network or behind a VPN; see docs/admin.md.
Host: 127.0.0.1
Port: 8091
Mode: pro
Timeout: 5000
Middlewares:
  Log: false
  Trace: false
# Log files rotate at 100 MB and are deleted after 7 days, so a long-running
# install never fills the disk. Use Mode: console under systemd or Docker,
# which keep logs themselves (configure their rotation too).
Log:
  Mode: file
  Path: logs/admin-web
  Rotation: size
  MaxSize: 100
  MaxBackups: 7
  KeepDays: 7
  Compress: true

Redis:
  Host: 127.0.0.1:6379
  Type: node
  # From the environment (botguard.env); empty means no password.
  Pass: ${BOTGUARD_REDIS_PASSWORD}
  DisableIdentity: false

# SQLite by default: the file and its tables are created on first start, no
# database server needed. Set BOTGUARD_DB_DRIVER=mysql and BOTGUARD_DB_DSN to
# use MySQL (then run botguard-ctl migrate up before starting). Give SQLite an
# absolute path in production; gateway, admin-web and botguard-ctl must all use
# the same file.
Database:
  Driver: ${BOTGUARD_DB_DRIVER}   # sqlite (default) | mysql
  DataSource: ${BOTGUARD_DB_DSN}  # SQLite file (default data/botguard.db) or MySQL DSN
# Deployments from before the Database block: a set BOTGUARD_MYSQL_DSN still
# selects MySQL when BOTGUARD_DB_DRIVER is empty.
MySQL:
  DataSource: ${BOTGUARD_MYSQL_DSN}

# Same value as the gateway: seals new secret pairs and TOTP secrets.
SecretKEK: ${BOTGUARD_SECRET_KEK}
SecretKEKPrevious: ["${BOTGUARD_SECRET_KEK_PREVIOUS}"]

# Gateway URL for browsers and SDKs (shown in integration snippets), and the
# URL the console uses to check the gateway's /readyz.
PublicEndpoint: ${BOTGUARD_PUBLIC_ENDPOINT}
GatewayURL: ${BOTGUARD_GATEWAY_URL}

# Session cookies are HTTPS-only by default. Plain-HTTP use is allowed only
# on a loopback Host (or with BOTGUARD_ADMIN_INSECURE_COOKIE=1).
CookieSecure: false
Session:
  IdleMinutes: 30
  AbsoluteHours: 8

TrustedProxies: []

# Hourly cleanup of old database rows; 0 days keeps them forever. Redis data
# needs none: every key expires on its own.
Cleanup:
  Enabled: true
  IntervalMinutes: 60
  AuditLogDays: 180
  # Secret pairs whose rotation grace ended, or that were revoked, this long ago.
  RetiredSecretDays: 30

# The console looks up the latest release on GitHub every IntervalHours and,
# when a newer one exists, tells owners on the dashboard and the system page
# (docs/admin.md 版本更新). Only a version number is fetched; nothing about
# this install is sent. Set Check: false where the server cannot or must not
# reach api.github.com; URL may point at a mirror of the same API.
# OneClick shows an upgrade button where install-systemd set up the updater
# (deb/rpm and release-tarball installs); the button only writes a request,
# the root-owned botguard-update service installs it. See docs/admin.md.
Update:
  Check: true
  IntervalHours: 6
  OneClick: true
