Name: botguard-gateway
Host: 127.0.0.1
Port: 8090
# pro keeps go-zero's CPU-based load shedding on; dev turns it off.
Mode: pro
Timeout: 3000
# Request bodies are bounded by the handlers (8 KiB, 32 KiB for solutions),
# which answer 400 INVALID_REQUEST; cmd/gateway turns go-zero's own MaxBytes
# and breaker middlewares off.
Middlewares:
  Log: false
  Trace: false
# Log files rotate at 100 MB and are deleted after 7 days, so a long-running
# install never fills the disk. Use Mode: console under systemd or Docker,
# which keep logs themselves (configure their rotation too).
Log:
  Mode: file
  Path: logs/gateway
  Rotation: size
  MaxSize: 100
  MaxBackups: 7
  KeepDays: 7
  Compress: true

Redis:
  Host: 127.0.0.1:6379
  Type: node
  # From the environment (botguard.env); empty means no password.
  Pass: ${BOTGUARD_REDIS_PASSWORD}
  # Set true for Redis < 7.2, which lacks CLIENT SETINFO; otherwise go-zero's
  # breaker counts the handshake error as a failure.
  DisableIdentity: false

# SQLite by default: the file and its tables are created on first start, no
# database server needed. Set BOTGUARD_DB_DRIVER=mysql and BOTGUARD_DB_DSN to
# use MySQL (then run botguard-ctl migrate up before starting), e.g.
# user:pass@tcp(127.0.0.1:3306)/botguard; parseTime, loc=UTC and
# time_zone='+00:00' are forced at startup. Give SQLite an absolute path in
# production; gateway, admin-web and botguard-ctl must all use the same file.
Database:
  Driver: ${BOTGUARD_DB_DRIVER}   # sqlite (default) | mysql
  DataSource: ${BOTGUARD_DB_DSN}  # SQLite file (default data/botguard.db) or MySQL DSN
# Deployments from before the Database block: a set BOTGUARD_MYSQL_DSN still
# selects MySQL when BOTGUARD_DB_DRIVER is empty.
MySQL:
  DataSource: ${BOTGUARD_MYSQL_DSN}

Challenge:
  Keys:
    # Generate with: openssl rand -base64 32
    - ID: k1
      Secret: ${BOTGUARD_CHALLENGE_KEY_K1}
      Active: true
  TTLSeconds: 120
  MaxDifficulty: 1000000

# Seals app secret keys in the database. Format id:base64(32 bytes); generate with
#   echo "k1:$(openssl rand -base64 32)"
# botguard-ctl must use the same value to create secret pairs.
SecretKEK: ${BOTGUARD_SECRET_KEK}
# Decrypt-only KEKs during a KEK rotation, same format. Keep them in the
# environment too; an unset variable leaves the list empty.
SecretKEKPrevious: ["${BOTGUARD_SECRET_KEK_PREVIOUS}"]
# Allowed distance between a signed request's timestamp and gateway time.
SignatureWindowSeconds: 300

TokenTTLSeconds: 60
VerifyResultTTLSeconds: 600
ClockSkewSeconds: 5
# CIDRs of reverse proxies whose X-Forwarded-For is trusted.
TrustedProxies: []

AppCache:
  TTLSeconds: 10
  Limit: 10000

RateLimit:
  ChallengePerIPPerMinute: 120
  SolvePerIPPerMinute: 120
  VerifyPerKeyPerMinute: 6000
  FallbackPerIPPerMinute: 5
  # Failed verify signatures per IP per minute before 429. Unknown secret
  # ids miss every cache, so this bounds MySQL lookups from probing.
  AuthFailuresPerIPPerMinute: 60
  # Image challenges per app per minute, counted across all IPs and replicas.
  # Beyond it the app's challenges degrade to PoW (x DegradedDifficultyFactor)
  # flagged CAPACITY_DEGRADED, so a distributed flood on one app cannot take
  # the image capacity all apps share. 0 disables.
  InteractivePerAppPerMinute: 6000
  # Image challenges per app per client network (IPv4 /24, IPv6 /48) per
  # minute. Issuing costs the client nothing, so without this a few networks
  # could spend the app quota above and push everyone onto the PoW-only path.
  # Beyond it that network gets 429 (not the degraded path). 0 disables.
  InteractivePerPrefixPerMinute: 300
  # Challenges per client network (IPv4 /24, IPv6 /48) per minute, across
  # apps. One IPv6 /48 holds 65536 /64 buckets, so the per-IP limit alone
  # does not hold back a tunnel or a proxy pool on one network. 80% of it
  # also counts as IP_HIGH_RATE. Raise it for large NATs. 0 disables.
  ChallengePerPrefixPerMinute: 1200

# Risk scoring (docs/challenge-types.md). For adaptive actions, a score >=
# MediumThreshold draws an interactive kind at random from the action's kinds;
# >= HighThreshold gives the hardest kind offered (also when the client asks
# for the fallback) and multiplies PoW work. The fallback multiplies it by
# FallbackDifficultyFactor. When an image challenge cannot be served (app
# quota above, or every generator busy with the pool empty) it degrades to
# PoW x DegradedDifficultyFactor, at least DegradedMinDifficulty per puzzle,
# instead of 503.
Risk:
  MediumThreshold: 30
  HighThreshold: 70
  HighDifficultyFactor: 4
  FallbackDifficultyFactor: 8
  DegradedDifficultyFactor: 8
  # Per puzzle; 60000 x 8 puzzles is about 2 s in a browser.
  DegradedMinDifficulty: 60000
  FailureWindowSeconds: 600
  # This many failed solves from one IP within the window and new challenges
  # answer 429 until the failures age out: past it another challenge is only
  # another guess. 0 disables.
  FailureBlockThreshold: 20
  # Kind ladder a page may ask for (levels in /v1/challenges): a failed solve
  # moves the client one tier up, this many passes in a row one tier down;
  # the tier is forgotten this many seconds after the client's last solve.
  LadderDowngradePasses: 3
  LadderWindowSeconds: 1800

# Health summary: every minute each gateway writes its request, error-code,
# degrade and puzzle-pool counts to Redis (kept 24 h) for the admin console's
# 运行状况 page. A minute with any 503, any degrade, or at least
# RateLimitedPerMinute RATE_LIMITED answers is recorded as an anomaly and
# logged at alert level (error.log); nothing is sent anywhere. Instance defaults to
# hostname:port.
Monitor:
  RateLimitedPerMinute: 300

# Prometheus metrics (botguard_gateway_* plus go-zero's http_server_* and Go
# runtime metrics) on a local port for a scraper; pprof stays off. Keep Host
# on 127.0.0.1 or a private address: the port has no authentication.
DevServer:
  Enabled: true
  Host: 127.0.0.1
  Port: 6470
  MetricsPath: /metrics
  EnablePprof: false

# Puzzles generated ahead of time, per interactive kind (~15 KB each), so
# bursts do not generate images on the request path. Each is served once.
# Workers 0 = half the CPUs; PerKind 0 turns the pool off.
PuzzlePool:
  PerKind: 64
  Workers: 0

Slider:
  Tolerance: 4

# Rotate puzzles: allowed angle error (docs/rotate-challenge.md).
Rotate:
  ToleranceDegrees: 7
